<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>กระดานการเดินทาง | Code Quest • เตรียมวิศวกรรมคอมพิวเตอร์ (ม.4)</title>
<meta name="theme-color" content="#0B2E5C">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%231F77D0'/><text x='50' y='67' font-size='46' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'>CQ</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css?v=20261124cq2">
<script src="js/icons.js?v=20261124cq2"></script>
<link rel="stylesheet" href="css/cq.css?v=20261124cq2">
</head>
<body class="cq">

<div class="lhero" style="--uc:#FFC21A"><div class="wrap"><div class="crumb"><a href="index.html">หน้าแรก</a> › กระดานการเดินทาง</div><h1>กระดานการเดินทาง</h1><div class="tags"><span>🧭 ทั้งห้องเดินทางถึงไหนแล้ว</span><span>📈 ความก้าวหน้าของฉัน</span><span>🤝 ไม่มีการจัดอันดับ</span></div><div class="big-ico"><i data-lucide="route"></i></div></div></div>
<div class="wrap" style="margin-top:-40px;position:relative;z-index:2;padding-bottom:60px"><div class="card lsec"><div id="jbTop"></div><div class="tabs" id="tabs"></div><div id="board"><p class="muted">กำลังโหลด...</p></div></div></div>
<script src="js/config.js?v=20261124cq2"></script><script src="js/data.js?v=20261124cq2"></script><script src="js/hero.js?v=20261124cq2"></script><script src="js/core.js?v=20261124cq2"></script><script src="js/addons.js?v=20261124cq2"></script><script src="js/live.js?v=20261124cq2"></script><script src="js/v3.js?v=20261124cq2"></script><script src="js/v4.js?v=20261124cq2"></script><script src="js/v5.js?v=20261124cq2"></script><script src="js/pets.js?v=20261124cq2"></script>
<script>
addEventListener('DOMContentLoaded', () => { T2.boot('board'); let room = 'ทั้งหมด', rows = null;
const E = T2.esc, tabs = document.getElementById('tabs');
tabs.innerHTML = ['ทั้งหมด', ...ROOMS].map(r => `<button class="${r === room ? 'on' : ''}">${r}</button>`).join('');
tabs.querySelectorAll('button').forEach(b => b.onclick = () => { room = b.textContent; tabs.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); draw(); });
const meRow = () => { const s = T2.state; return { id: T2.user ? T2.user.uid : 'me', nick: s.nick || 'ฉัน', room: s.room || '-', hero: s.hero || null, xp: T2.xp(), level: T2.lv(), badges: (s.badges || []).length + (s.tb || []).length, done: Object.keys(s.done || {}).length }; };
const draw = () => { const box = document.getElementById('board'), top = document.getElementById('jbTop');
  if (T2.fb && !T2.user) { top.innerHTML = ''; box.innerHTML = '<div class="center"><p>เข้าสู่ระบบเพื่อดูการเดินทางของทั้งห้อง</p><button class="btn gold" onclick="T2.login()">เข้าสู่ระบบด้วย Google</button></div>'; return; }
  const me = meRow(); let all = rows;
  if (!all) { box.innerHTML = '<p class="muted">กำลังโหลด...</p>'; return; }
  all = all.filter(r => r.id !== me.id).concat([me]);
  const list = all.filter(r => room === 'ทั้งหมด' || r.room === room);
  const N = LESSONS.length, sum = k => list.reduce((a, r) => a + (+r[k] || 0), 0), cleared = sum('done'), goal = Math.max(1, list.length * N), pct = Math.round(cleared / goal * 100);
  const lv = T2.level(me.xp), nextQ = LESSONS.find(l => l.ready && !T2.state.done['l' + l.id]);
  top.innerHTML = `<div class="jb-me"><span>${heroSVG(me.hero, me.level, 92)}</span><div><h3>${E(me.nick)} เดินทางมาแล้ว ${me.done} จาก ${N} เควส</h3>
      <p>${lv.cur.icon} ${lv.cur.name}${lv.next ? ` • อีก ${lv.next.xp - me.xp} XP ถึงระดับ “${lv.next.name}”` : ''}</p><div class="bar"><i style="width:${lv.pct}%"></i></div>
      <div class="jb-chips"><span>⚡ ${me.xp} XP</span><span>🎖️ ${me.badges} เหรียญ</span><span>🔥 เรียนต่อเนื่อง ${T2.state.streak || 0} วัน</span>${nextQ ? `<span>➡️ ก้าวถัดไป: เควส ${ACT(nextQ.id)} ${nextQ.title}</span>` : ''}</div></div></div>`;
  box.innerHTML = `<div class="jb-stats"><div class="jb-stat"><b>${list.length}</b><span>ฮีโร่ร่วมเดินทาง</span></div><div class="jb-stat"><b>${cleared}</b><span>เควสที่ทั้งห้องผ่านรวมกัน</span></div><div class="jb-stat"><b>${sum('xp').toLocaleString()}</b><span>XP รวมของทั้งห้อง</span></div><div class="jb-stat"><b>${sum('badges')}</b><span>เหรียญที่เก็บได้รวมกัน</span></div></div>
    <div class="jb-goal"><h3>🎯 เป้าหมายร่วมของห้อง: ทุกคนไปถึงเทศกาลเกมด้วยกัน</h3><div class="bar"><i style="width:${pct}%"></i></div><small>ผ่านไปแล้ว ${cleared} จาก ${goal} เควส (${pct}%) • ทุกเควสที่ใครสักคนผ่าน แถบนี้ก็ขยับ</small></div>
    <h3>🗺️ ตอนนี้ใครอยู่ตรงไหนของเส้นทาง</h3>
    <div class="jb-road">${Array.from({ length: N + 1 }, (_, k) => { const L = k ? LESSONS[k - 1] : null, u = L ? UNITS.find(x => x.n === L.unit) : null;
      const who = list.filter(r => Math.min(N, +r.done || 0) === k).sort((a, b) => String(a.nick).localeCompare(String(b.nick), 'th'));
      return `<div class="jb-step ${me.done === k && (room === 'ทั้งหมด' || me.room === room) ? 'here' : ''}" style="--uc:${u ? u.color : '#94A3B8'}"><div class="jb-lab"><small>${k ? 'ผ่านเควส ' + L.no : 'จุดเริ่มต้น'}</small><b>${k ? L.title : 'เตรียมออกเดินทาง'}</b></div>
        <div class="jb-who">${who.map(r => `<span class="jb-h ${r.id === me.id ? 'me' : ''}" title="${E((HERO_CLASSES[(r.hero || {}).cls] || {}).name || '')}">${heroSVG(r.hero, r.level || 0, 34)}${E(r.nick || '')}${r.id === me.id ? ' (ฉัน)' : ''}</span>`).join('') }</div></div>`; }).join('')}</div>
    <div class="jb-note">🤝 กระดานนี้ไม่เรียงลำดับคะแนน ชื่อในแต่ละจุดเรียงตามตัวอักษร แต่ละคนมีจังหวะการเดินทางของตัวเอง เห็นเพื่อนอยู่จุดเดียวกันหรือจุดก่อนหน้า ชวนกันไปต่อได้เลย</div>`;
  T2.icons(); };
const load = async () => { if (window.CQ_PREVIEW_ROWS) { rows = window.CQ_PREVIEW_ROWS; draw(); return; } if (!T2.fb) { rows = []; draw(); return; } if (!T2.user) { draw(); return; } const { db, collection, getDocs } = T2.fb;
  try { const snap = await getDocs(collection(db, 'board')); rows = snap.docs.map(d => Object.assign({ id: d.id }, d.data())).filter(r => r.nick); } catch (e) { rows = []; console.warn(e); } draw(); };
const tick = () => { if (T2.ready && rows === null) load(); else draw(); }; T2.on(tick); tick(); });
</script>
</body>
</html>
